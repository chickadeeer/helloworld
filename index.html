<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // ACCESS</title>
    <style>
        /* --- IMPORTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        /* --- RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- THE INVISIBLE LOADER --- */
        /* This loads the GIF resource but makes it visually non-existent */
        #hidden-asset {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            opacity: 0;
        }

        /* --- SLEEK CRT CONTAINER --- */
        .terminal-window {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 4rem;
        }

        /* --- SUBTLE TEXTURE (The "Sleek" vibe) --- */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Very faint grid instead of scanlines for a modern look */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        /* --- TYPOGRAPHY --- */
        .content {
            text-align: left;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            font-size: 5rem; /* Larger, bolder */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 2rem;
            color: #fff;
            /* Tighter, cleaner glow */
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); 
            opacity: 0; /* Hidden before animation */
            animation: textFadeIn 1s ease forwards;
            animation-delay: 0.5s;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: #fff;
            margin-bottom: 2rem;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            opacity: 0;
            animation: expandLine 1s ease forwards;
            animation-delay: 1.2s;
        }

        p {
            font-size: 1.1rem;
            color: #888; /* Darker grey for contrast */
            margin-bottom: 3rem;
            min-height: 1.5em; /* Reserve space */
        }

        /* The Typing Cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1rem;
            background-color: #fff;
            animation: blink 1s step-end infinite;
        }

        /* --- UI ELEMENTS --- */
        .status-bar {
            position: absolute;
            bottom: 3rem;
            left: 4rem;
            right: 4rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid #222;
            padding-top: 1rem;
        }

        .btn {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 14px 40px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            animation: fadeUp 1s ease forwards;
            animation-delay: 3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes expandLine {
            from { width: 0; opacity: 0; }
            to { width: 100px; opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <img src="https://detailsplease.s68781738.workers.dev/" id="hidden-asset" alt="">

    <div class="grid-overlay"></div>

    <div class="terminal-window">
        <div class="content">
            <h1>Protocol<br>Initiated.</h1>
            <div class="divider"></div>
            
            <p id="typewriter"><span class="cursor"></span></p>

            <a href="#" class="btn">Enter System</a>
        </div>

        <div class="status-bar">
            <span>System: Online</span>
            <span>Encryption: AES-256</span>
            <span>ID: 049-X</span>
        </div>
    </div>

    <script>
        const text = "The interface is ready. Awaiting your command.";
        const speed = 40; 
        const delay = 1500; // Wait for H1 animation

        setTimeout(() => {
            let i = 0;
            const element = document.getElementById("typewriter");
            // Remove initial cursor to reset
            element.innerHTML = ""; 
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML += '<span class="cursor"></span>';
                }
            }
            type();
        }, delay);
    </script>
</body>
</html>

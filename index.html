<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_BOOT // INITIALIZED</title>
    <style>
        /* --- IMPORTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Space Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* No scrollbars for that sleek feel */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- THE CRT SCREEN CONTAINER --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            
            /* The "Turn On" Animation */
            animation: turnOn 4s ease-in-out forwards;
            opacity: 0;
            transform: scaleY(0);
        }

        /* --- CRT VISUAL EFFECTS (The Magic) --- */
        
        /* 1. Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* 2. Flicker & Noise */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        /* 3. Vignette (Curved corners dark edges) */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.9) 100%);
            z-index: 20;
            pointer-events: none;
        }

        /* --- TYPOGRAPHY & CONTENT --- */
        .content {
            text-align: left;
            max-width: 800px;
            padding: 2rem;
            z-index: 5;
            mix-blend-mode: screen; /* Helps text glow blend with bg */
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 2rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            max-width: 600px;
        }

        /* The Typing Cursor */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.2rem;
            background-color: white;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            box-shadow: 0 0 10px white;
        }

        .meta-text {
            font-size: 0.8rem;
            opacity: 0.6;
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            text-align: right;
        }

        .btn {
            display: inline-block;
            border: 2px solid white;
            padding: 10px 30px;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            opacity: 0; /* Hidden initially */
            animation: fadeIn 1s ease forwards;
            animation-delay: 3.5s; /* Wait for typing to finish */
        }

        .btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }

        /* --- ANIMATIONS --- */
        
        @keyframes turnOn {
            0% { transform: scale(1, 0.002); opacity: 0; filter: brightness(30); }
            30% { transform: scale(1, 0.002); opacity: 1; filter: brightness(10); }
            60% { transform: scale(1, 1); opacity: 1; filter: brightness(5); }
            100% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            5% { opacity: 0.05; }
            10% { opacity: 0.02; }
            15% { opacity: 0.06; }
            100% { opacity: 0.02; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Glitch effect for hover text */
        .glitch-hover:hover {
            animation: glitch-anim 0.3s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="screen">
        <div class="content">
            <div class="meta-text">
                SIGNAL_STRENGTH: 100%<br>
                FREQ: 60Hz<br>
                CH: 03
            </div>

            <h1 id="headline"></h1>
            <p id="subtext"></p>
            
            <a href="#" class="btn">Initialize</a>
        </div>
    </div>

    <script>
        // TYPEWRITER EFFECT CONFIGURATION
        const headlineText = "HELLO_WORLD.";
        const subText = "We are architects of the digital void. Welcome to the archive.";
        const speed = 50; // Speed in ms

        let i = 0;
        let j = 0;

        // Delay start slightly to allow Turn-On animation to happen
        setTimeout(typeHeadline, 1500);

        function typeHeadline() {
            if (i < headlineText.length) {
                document.getElementById("headline").innerHTML += headlineText.charAt(i);
                i++;
                setTimeout(typeHeadline, speed + Math.random() * 50); // Add randomness for realism
            } else {
                // Add blinking cursor to end of headline
                document.getElementById("headline").innerHTML += '<span class="cursor"></span>';
                setTimeout(typeSubtext, 500);
            }
        }

        function typeSubtext() {
            if (j < subText.length) {
                document.getElementById("subtext").innerHTML += subText.charAt(j);
                j++;
                setTimeout(typeSubtext, 30);
            }
        }
    </script>
</body>
</html>

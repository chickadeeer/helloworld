<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chickadee // Profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Mono', monospace;
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    color: #fff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #hidden-asset {
    width: 1px;
    height: 1px;
    opacity: 0;
    position: absolute;
    pointer-events: none;
  }

  /* --- Card --- */
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 3rem 4rem;
    text-align: center;
    max-width: 500px;
    width: 90%;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    transition: all 0.5s ease;
    overflow: hidden;
  }

  .card.expanded { max-width: 800px; }

  h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
  }

  p {
    font-size: 1.2rem;
    color: #ccc;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.3s;
  }

  .btn {
    display: inline-block;
    padding: 12px 36px;
    background: #fff;
    color: #000;
    font-weight: 700;
    text-transform: uppercase;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.6s;
    cursor: pointer;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(255,255,255,0.3);
  }

  /* Tabs */
  .tabs {
    display: none;
    margin-top: 2rem;
    text-align: left;
  }

  .tabs.active { display: block; }

  .tab-buttons {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .tab-buttons button {
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }

  .tab-buttons button.active,
  .tab-buttons button:hover {
    background: #fff;
    color: #000;
  }

  .tab-content {
    font-size: 1rem;
    line-height: 1.6;
    color: #ccc;
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

<!-- Hidden Cloudflare loader -->
<img src="https://detailsplease.s68781738.workers.dev/" id="hidden-asset" alt="">

<div class="card" id="card">
  <h1>Chickadee</h1>
  <p>Hello! Welcome to my personal presentation.</p>
  <div class="btn" id="enterBtn">Enter</div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab-buttons">
      <button class="active" data-tab="about">About</button>
      <button data-tab="socials">Socials</button>
      <button data-tab="interests">Interests</button>
    </div>
    <div class="tab-content" id="tabContent">
      <div id="about">Hi! I'm Chickadee. I love tech, web design, and creating sleek interfaces.</div>
      <div id="socials" style="display:none;">
        <ul>
          <li>YouTube: <a href="#" target="_blank">My Channel</a></li>
          <li>Twitter: <a href="#" target="_blank">@MyHandle</a></li>
          <li>Instagram: <a href="#" target="_blank">@MyInsta</a></li>
        </ul>
      </div>
      <div id="interests" style="display:none;">
        <ul>
          <li>Coding & Electronics</li>
          <li>Art & Design</li>
          <li>Gaming & Community Projects</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
const enterBtn = document.getElementById('enterBtn');
const card = document.getElementById('card');
const tabs = document.getElementById('tabs');
const tabButtons = tabs.querySelectorAll('button');
const tabContent = tabs.querySelectorAll('#tabs > .tab-content > div, #tabContent > div');

enterBtn.addEventListener('click', () => {
  card.classList.add('expanded');
  tabs.classList.add('active');
  enterBtn.style.display = 'none';
});

// Tab switching
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    tabContent.forEach(content => content.style.display = 'none');
    const selected = document.getElementById(btn.dataset.tab);
    if (selected) selected.style.display = 'block';
  });
});
</script>

</body>
</html>
